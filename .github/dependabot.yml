#
# Tamed Dependabot: weekly, grouped into one PR per ecosystem, and capped low so
# stale branches never pile up again. Grouped PRs mean a single branch per
# ecosystem at a time; merged branches auto-delete (repo setting). This also
# covers Cargo deps, replacing the removed weekly cargo-update workflow — unlike
# a GITHUB_TOKEN Actions job, Dependabot is allowed to open PRs.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
