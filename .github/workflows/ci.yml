#
# CI runs on pushes to main, pull requests, and release tags.
# Local checks (scripts/ci-check.sh) also catch issues before push.
# Use workflow_dispatch for manual runs when needed.

name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Fast checks (no compilation) ─────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt

      - name: fmt
        run: cargo fmt --all -- --check

      - name: Copyright headers
        run: |
          missing=0
          while IFS= read -r file; do
            if ! head -10 "$file" | grep -q "Copyright (c) 2025 TRUSTEDGE LABS LLC"; then
              echo "Missing copyright header: $file"
              missing=$((missing + 1))
            fi
          done < <(find . -type f \( -name "*.rs" -o -name "*.yml" -o -name "*.yaml" -o -name "*.toml" \) \
            -not -path "./target/*" -not -path "./.git/*" -not -path "./.planning/*")
          if [ $missing -gt 0 ]; then
            echo "::error::$missing files missing copyright headers. Run: ./scripts/fix-copyright.sh"
            exit 1
          fi

      - name: TODO hygiene
        run: |
          count=$(grep -rn '// TODO\|// FIXME\|// HACK\|// XXX\|todo!()\|unimplemented!()' \
            --include="*.rs" crates/ 2>/dev/null | wc -l || echo 0)
          if [ "$count" -gt 0 ]; then
            echo "::error::Found $count unimplemented TODO/FIXME/HACK/XXX markers"
            grep -rn '// TODO\|// FIXME\|// HACK\|// XXX\|todo!()\|unimplemented!()' \
              --include="*.rs" crates/ || true
            exit 1
          fi

      - name: Secret struct derive check
        run: |
          ok=true
          for file_struct in \
            "crates/core/src/backends/yubikey.rs:YubiKeyConfig" \
            "crates/core/src/backends/software_hsm.rs:SoftwareHsmConfig" \
            "crates/platform/src/ca/models.rs:LoginRequest" \
            "crates/platform/src/ca/mod.rs:CAConfig"; do
            FILE="${file_struct%%:*}"
            STRUCT="${file_struct##*:}"
            if grep -B2 "pub struct $STRUCT" "$FILE" | grep -q "Serialize"; then
              echo "::error::$STRUCT in $FILE has Serialize derive (forbidden on secret-holding structs)"
              ok=false
            fi
            if ! grep -q "REDACTED" "$FILE"; then
              echo "::error::$STRUCT in $FILE missing [REDACTED] in Debug impl"
              ok=false
            fi
          done
          [ "$ok" = true ]

      - name: Setup Node.js for dashboard checks
        if: hashFiles('web/dashboard/package.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Dashboard bundle credential guard
        if: hashFiles('web/dashboard/package.json') != ''
        run: |
          cd web/dashboard
          npm ci --ignore-scripts
          npm run build
          if grep -r "VITE_API_KEY" build/ 2>/dev/null; then
            echo "::error::VITE_API_KEY found in dashboard bundle — credential leak detected"
            exit 1
          fi
          echo "No API credentials in dashboard bundle"

  # ── Build + clippy + test (single compile) ──────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpcsclite-dev libdbus-1-dev pkg-config pkgconf

      # Clippy (reuses build artifacts for test step)
      - name: Clippy workspace
        run: |
          cargo clippy -p sealedge-core --all-targets --all-features -- -D warnings
          cargo clippy -p sealedge-platform --all-targets --features "http,ca,openapi,yubikey" -- -D warnings
          cargo clippy -p sealedge-platform-server --all-targets -- -D warnings
          cargo clippy -p sealedge-cli --all-targets --all-features -- -D warnings
          cargo clippy -p sealedge-seal-cli --all-targets -- -D warnings
          cargo clippy -p sealedge-seal-protocols --all-targets -- -D warnings
          cargo clippy -p sealedge-types --all-targets -- -D warnings
          cargo clippy -p sealedge-wasm --all-targets -- -D warnings
          cargo clippy -p sealedge-seal-wasm --all-targets -- -D warnings

      # Build CLI binaries (needed by roundtrip_integration tests that invoke sealedge binary)
      - name: Build workspace
        run: cargo build --workspace --locked

      # Tests (reuses build artifacts)
      - name: Test workspace (default features)
        run: cargo test --workspace --no-default-features --locked

      - name: Test sealedge-core (all non-yubikey features)
        run: cargo test -p sealedge-core --features "audio,git-attestation,keyring,insecure-tls" --locked

      - name: Test sealedge-core (yubikey simulation)
        run: cargo test -p sealedge-core --features yubikey --lib --locked

      - name: Test sealedge-platform features
        run: |
          cargo test -p sealedge-platform --lib --locked
          cargo test -p sealedge-platform --test verify_integration --locked
          cargo test -p sealedge-platform --test verify_integration --features http --locked

      # WASM (quick check, no full build)
      - name: WASM build verification
        run: |
          cargo check -p sealedge-wasm --target wasm32-unknown-unknown
          cargo check -p sealedge-seal-wasm --target wasm32-unknown-unknown

      - name: Dependency tree size
        run: |
          dep_count=$(cargo tree --workspace --depth 1 --prefix none --no-dedupe 2>/dev/null | sort -u | wc -l)
          echo "Dependency tree: $dep_count unique crates (baseline: 70)"
          if [ "$dep_count" -gt 80 ]; then
            echo "::warning::Dependency tree grew beyond threshold ($dep_count > 80)"
          fi

  # ── Security audit (cargo-audit only, fast) ─────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: taiki-e/install-action@5e35b238ee3d0a48aa25ae877adcff74a6ddd2e0 # cargo-audit

      - name: Security audit
        run: cargo audit

  # ── Self-attestation (release tags only) ─────────────────────
  self-attestation:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config pkgconf

      - name: Build seal binary
        run: cargo build -p sealedge-seal-cli --release --locked

      - name: Compute seal binary SHA256 checksum
        run: |
          sha256sum ./target/release/seal | awk '{print $1 "  seal"}' > seal.sha256

      # A pushed tag does not create a GitHub Release; the upload steps below
      # need one to exist. Create it if missing so a plain `git push --tags`
      # is self-sufficient (previously the uploads failed with "release not
      # found" when the tag was pushed without a Release). Idempotent.
      - name: Ensure GitHub Release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

      - name: Upload seal binary + checksum to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            ./target/release/seal \
            seal.sha256 \
            --clobber

      - name: Generate CycloneDX SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft scan file:./target/release/seal -o cyclonedx-json > seal-sbom.cdx.json

      - name: Attest SBOM (dogfood sealedge-attest-sbom-action)
        id: attest
        uses: TrustEdge-Labs/sealedge-attest-sbom-action@v2  # TODO: pin to commit SHA after first @v2.0.0 tag (Plan 03)
        with:
          binary: ./target/release/seal
          sbom: seal-sbom.cdx.json

      - name: Upload attestation + SBOM + build.pub to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.attest.outputs.attestation-path }}" \
            seal-sbom.cdx.json \
            "${SEAL_PUB}" \
            --clobber
