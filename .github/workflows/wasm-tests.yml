name: WebAssembly Build Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'crates/wasm/**'
      - 'crates/seal-wasm/**'
      - 'crates/core/**'
      - '.github/workflows/wasm-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'crates/wasm/**'
      - 'crates/seal-wasm/**'
      - 'crates/core/**'
      - '.github/workflows/wasm-tests.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  wasm-size-check:
    name: WASM Size Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install cargo-binstall
      uses: taiki-e/install-action@0863870cb2b3e98da71d6f925d05ecf26c4b96c1 # cargo-binstall
    - name: Install wasm-pack
      run: cargo binstall wasm-pack --no-confirm

    - name: Build sealedge-wasm and check size
      run: |
        cd crates/wasm
        wasm-pack build --target web --release
        wasm_size=$(wc -c < pkg/sealedge_wasm_bg.wasm)
        echo "sealedge-wasm size: $wasm_size bytes"
        # Fail if WASM is larger than 2MB (reasonable size for crypto operations)
        if [ $wasm_size -gt 2097152 ]; then
          echo "❌ sealedge-wasm is too large: $wasm_size bytes (max: 2MB)"
          exit 1
        else
          echo "✅ sealedge-wasm size is acceptable: $wasm_size bytes"
        fi

    - name: Build sealedge-seal-wasm and check size
      run: |
        cd crates/seal-wasm
        wasm-pack build --target web --release
        wasm_size=$(wc -c < pkg/sealedge_seal_wasm_bg.wasm)
        echo "sealedge-seal-wasm size: $wasm_size bytes"
        # Fail if WASM is larger than 1MB (verification should be lightweight)
        if [ $wasm_size -gt 1048576 ]; then
          echo "❌ sealedge-seal-wasm is too large: $wasm_size bytes (max: 1MB)"
          exit 1
        else
          echo "✅ sealedge-seal-wasm size is acceptable: $wasm_size bytes"
        fi

  wasm-build-check:
    name: WASM Build Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install cargo-binstall
      uses: taiki-e/install-action@0863870cb2b3e98da71d6f925d05ecf26c4b96c1 # cargo-binstall
    - name: Install wasm-pack
      run: cargo binstall wasm-pack --no-confirm

    - name: Build and verify WASM package
      run: |
        cd crates/wasm
        # Verify WASM package builds successfully for web target
        wasm-pack build --target web --out-dir pkg-test

    - name: Verify compilation of WASM tests
      run: |
        cd crates/wasm
        # Verify WASM tests compile (without running in browser)
        cargo check --tests --target wasm32-unknown-unknown
