[package]
name = "sealedge-seal-wasm"
version = "0.2.0"
edition = "2021"
description = "WASM bindings for Sealedge verification"
authors = ["TrustEdge Labs <dev@trustedgelabs.com>"]
license = "MPL-2.0"

[lib]
crate-type = ["cdylib"]

[package.metadata.trustedge]
tier = "stable"
maintained = true

[package.metadata.cargo-machete]
ignored = ["getrandom", "getrandom_v03"]

[dependencies]
# Protocol definitions from seal-protocols
sealedge-seal-protocols = { path = "../seal-protocols" }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = { workspace = true }
console_error_panic_hook = "0.1"

# WASM-compatible crypto dependencies
ed25519-dalek = { version = "3", default-features = false, features = ["rand_core"] }
getrandom = { version = "0.2", features = ["js"] }  # Activates "js" on transitive getrandom 0.2 for WASM target
getrandom_v03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }  # Activates "wasm_js" on getrandom 0.3 for rand 0.9's chain
aes-gcm = { workspace = true }
rand = { workspace = true }
base64 = "0.23"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "File",
  "FileReader",
  "Blob",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemHandle",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"