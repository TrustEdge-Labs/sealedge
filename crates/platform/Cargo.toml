[package]
name = "sealedge-platform"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Sealedge Platform — consolidated verification and CA service"

[package.metadata.trustedge]
tier = "stable"
maintained = true

[lib]
name = "sealedge_platform"
path = "src/lib.rs"

# Always-on dependencies (verification core)
[dependencies]
sealedge-types = { workspace = true }
sealedge-core = { path = "../core" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
hex = "0.4"
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
tracing = "0.1"
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
regex = "1.0"
utoipa = { version = "4.0", features = ["axum_extras", "chrono", "uuid"], optional = true }

# Feature-gated: postgres
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid", "migrate"], optional = true }
bcrypt = { version = "0.15", optional = true }

# Feature-gated: http (token hashing and env config loading)
sha2 = { version = "0.10", optional = true }
dotenvy = { version = "0.15", optional = true }

# Feature-gated: ca
x509-parser = { version = "0.16", optional = true }
der = { version = "0.7", optional = true }
spki = { version = "0.7", optional = true }
pkcs8 = { version = "0.10", optional = true }
x509-cert = { version = "0.2", optional = true }
const-oid = { version = "0.9", optional = true }

# Feature-gated: http
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
utoipa-swagger-ui = { version = "6.0", features = ["axum"], optional = true }
governor = { version = "0.10", features = ["dashmap"], optional = true }
ipnet = { version = "2", optional = true }

[features]
default = []
postgres = ["dep:sqlx", "dep:bcrypt", "dep:sha2", "dep:dotenvy"]
ca = ["dep:x509-parser", "dep:der", "dep:spki", "dep:pkcs8", "dep:x509-cert", "dep:const-oid"]
yubikey = ["ca", "sealedge-core/yubikey"]
http = ["dep:axum", "dep:tower", "dep:tower-http", "dep:tokio", "dep:utoipa-swagger-ui", "dep:sha2", "dep:dotenvy", "dep:governor", "dep:ipnet"]
test-utils = []
openapi = ["dep:utoipa"]

[dev-dependencies]
tokio = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
tempfile = "3"
# HTTP integration test utilities
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
# Platform integration test utilities (DB-backed tests, all #[ignore])
# Uses 14.x which is compatible with axum 0.7 (our workspace version)
axum-test = "14.10"
